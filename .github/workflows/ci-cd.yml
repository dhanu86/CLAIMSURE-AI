name: ClaimSure-AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Job 1: Test & Validate Python Backend
  # ------------------------------------------------------------------
  backend-test:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: test-secret-key-for-ci-cd-pipeline-2026!
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          STORAGE_DIR: ./storage
        run: |
          python -m pytest tests -v

  # ------------------------------------------------------------------
  # Job 2: Lint, Typecheck & Build React Frontend
  # ------------------------------------------------------------------
  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install


      - name: Run Frontend Linter (Oxlint)
        run: npm run lint

      - name: Run Frontend Typecheck & Build (Vite)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://claimsure-ai-api.onrender.com/api' }}
        run: npm run build

  # ------------------------------------------------------------------
  # Job 3: Continuous Deployment to Vercel
  # ------------------------------------------------------------------
  deploy-vercel:
    name: Deploy to Vercel
    needs: [ backend-test, frontend-build ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Vercel Secrets
        id: vercel_check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Vercel GitHub Action secrets detected."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=Vercel Secrets::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are not set in GitHub Secrets. If using Vercel's native GitHub Integration, Vercel will deploy automatically on push."
          fi

      - name: Deploy Preview to Vercel
        uses: amondnet/vercel-action@v25
        if: steps.vercel_check.outputs.configured == 'true' && github.event_name == 'pull_request'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./

      - name: Deploy Production to Vercel
        uses: amondnet/vercel-action@v25
        if: steps.vercel_check.outputs.configured == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
