
name: ClaimSure-AI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # --------------------------------------------------
  # Job 1: Backend tests and RAG evaluation
  # --------------------------------------------------
  backend-test:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: test-secret-key-for-ci-cd-pipeline-2026!
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          STORAGE_DIR: ./storage
        run: python -m pytest tests -v

      - name: MLOps - RAG Retrieval & Agentic AI Evaluation
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: test-secret-key-for-ci-cd-pipeline-2026!
        run: python -m pytest tests/test_mlops_rag_eval.py -v -s

  # --------------------------------------------------
  # Job 2: Frontend lint and production build
  # --------------------------------------------------
  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Linter
        run: npm run lint

      - name: Build Frontend
        env:
          VITE_API_URL: https://claimsureai-backend.onrender.com/api
        run: npm run build

  # --------------------------------------------------
  # Job 3: Production deployment to Vercel
  # --------------------------------------------------
  deploy-vercel:
    name: Deploy to Vercel
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Vercel Configuration
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Vercel secrets are missing."
            exit 1
          fi
          echo "Vercel configuration detected."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel Production Artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Prebuilt Project to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # --------------------------------------------------
  # Job 4: Production deployment to Render
  # --------------------------------------------------
  deploy-backend:
    name: Deploy Backend AI/RAG Service
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Cloud Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing."
            exit 1
          fi

          echo "Triggering Render deployment..."

          curl --fail-with-body --show-error --silent \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment request accepted."
